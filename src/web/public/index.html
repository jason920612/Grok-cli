<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>grok-code</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel2: #1c2330; --border: #30363d;
    --text: #e6edf3; --dim: #8b949e; --accent: #58a6ff; --green: #3fb950;
    --red: #f85149; --yellow: #d29922; --magenta: #bc8cff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text); font: 14px/1.55 -apple-system, "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  code, pre, .mono { font-family: "SF Mono", "Cascadia Code", Consolas, monospace; }

  header {
    display: flex; align-items: center; gap: 14px; padding: 10px 16px;
    background: var(--panel); border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  header .brand { font-weight: 700; color: var(--accent); }
  header .meta { color: var(--dim); font-size: 12px; }
  header .spacer { flex: 1; }
  .toggle {
    cursor: pointer; user-select: none; border: 1px solid var(--border); border-radius: 6px;
    padding: 4px 10px; font-size: 12px; color: var(--dim); background: var(--panel2);
  }
  .toggle.on { color: var(--bg); background: var(--accent); border-color: var(--accent); font-weight: 600; }
  .toggle.yes.on { background: var(--green); border-color: var(--green); }
  #usage { color: var(--dim); font-size: 12px; }
  .ws { color: var(--dim); font-size: 12px; cursor: pointer; max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-bottom: 1px dotted var(--border); }
  .ws:hover { color: var(--accent); border-color: var(--accent); }
  .sel { background: var(--panel2); color: var(--dim); border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; font-size: 12px; }
  .menu { display: none; position: absolute; top: 46px; right: 12px; z-index: 30; background: var(--panel2); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px; min-width: 280px; max-height: 70vh; overflow-y: auto; box-shadow: 0 8px 24px #0008; }
  .menu.open { display: block; }
  .menu .mi { padding: 6px 10px; border-radius: 6px; cursor: pointer; display: flex; gap: 8px; }
  .menu .mi:hover { background: var(--accent); color: var(--bg); }
  .menu .mi .mname { font-family: "SF Mono", Consolas, monospace; font-weight: 600; min-width: 96px; }
  .menu .mi .mdesc { color: var(--dim); font-size: 12px; }
  .menu .mi:hover .mdesc { color: var(--bg); }

  main { flex: 1; display: flex; min-height: 0; }
  #chat { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  #side {
    width: 340px; flex-shrink: 0; border-left: 1px solid var(--border); background: var(--panel);
    overflow-y: auto; padding: 12px; font-size: 12px;
  }
  #side h3 { margin: 4px 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); }
  .panel { margin-bottom: 16px; }
  .prog { color: var(--green); font-weight: 600; }
  .muted { color: var(--dim); }
  /* Plan checklist */
  .pstep { display: flex; gap: 8px; padding: 3px 0; align-items: baseline; }
  .pstep .ico { width: 16px; flex-shrink: 0; text-align: center; }
  .pstep.done .ico { color: var(--green); } .pstep.done .txt { color: var(--dim); text-decoration: line-through; }
  .pstep.active .ico { color: var(--yellow); } .pstep.active .txt { color: var(--text); font-weight: 600; }
  .pstep.pending .ico { color: var(--dim); } .pstep.pending .txt { color: var(--dim); }
  /* Per-agent cards */
  .agent { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; overflow: hidden; }
  .agent .ahead { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--panel2); }
  .agent .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex-shrink: 0; }
  .agent.running .dot { background: var(--green); animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  .agent .aname { font-weight: 600; }
  .agent .astep { margin-left: auto; color: var(--dim); font-size: 11px; }
  .agent .ausage { padding: 2px 10px; color: var(--dim); font-size: 10.5px; font-variant-numeric: tabular-nums; }
  .agent .ausage:empty { display: none; }
  .agent .alog { padding: 4px 10px; max-height: 160px; overflow-y: auto; }
  .agent .aline { padding: 1px 0; color: var(--dim); white-space: pre-wrap; word-break: break-word; }
  .agent .aline.warn { color: var(--yellow); } .agent .aline.verifier { color: var(--magenta); }
  .agent .aline.cur { color: var(--text); }

  .msg { max-width: 80%; padding: 9px 13px; border-radius: 10px; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: #1f6feb33; border: 1px solid #1f6feb55; }
  .msg.assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); }
  .msg.system { align-self: center; background: transparent; color: var(--dim); font-size: 12px; padding: 2px; }
  .msg.error { align-self: center; color: var(--red); border: 1px solid var(--red); background: #f8514916; }
  .out { align-self: stretch; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); overflow: hidden; }
  .out .ohead { padding: 6px 12px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); border-bottom: 1px solid var(--border); }
  .out pre { margin: 0; padding: 10px 12px; overflow-x: auto; font-size: 12.5px; white-space: pre-wrap; word-break: break-word; }

  .card { align-self: flex-start; max-width: 88%; max-height: calc(100vh - 180px); display: flex; flex-direction: column;
    border: 1px solid var(--border); border-radius: 10px; background: var(--panel2); overflow: hidden; }
  .card .chead { padding: 8px 12px; font-weight: 600; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .card.approval .chead { color: var(--yellow); }
  .card.ask .chead { color: var(--accent); }
  .card .cbody { padding: 10px 12px; }
  .card .cbody.scroll { overflow-y: auto; flex: 1; }
  .card .cfoot { padding: 10px 12px; border-top: 1px solid var(--border); background: var(--panel); flex-shrink: 0; }
  .card .kv { color: var(--dim); font-size: 12px; margin: 2px 0; }
  .card .kv b { color: var(--text); font-weight: 600; }
  .btnrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  button.act-btn {
    cursor: pointer; border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px;
    background: var(--panel); color: var(--text); font-size: 13px;
  }
  button.act-btn:hover { border-color: var(--accent); }
  button.act-btn.primary { background: var(--green); border-color: var(--green); color: #07140a; font-weight: 600; }
  button.act-btn.danger { background: var(--red); border-color: var(--red); color: #1a0606; font-weight: 600; }
  .card.resolved { opacity: .5; }
  .card input[type=text] {
    width: 100%; margin-top: 6px; padding: 6px 8px; background: var(--bg);
    border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 13px;
  }

  .filecard { align-self: stretch; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); overflow: hidden; }
  .filecard .fhead { cursor: pointer; user-select: none; padding: 7px 12px; display: flex; align-items: center; gap: 8px; }
  .filecard .fhead:hover { background: var(--panel2); }
  .filecard .caret { color: var(--dim); width: 10px; }
  .filecard .stat { color: var(--dim); font-size: 12px; margin-left: auto; }
  .filecard .add { color: var(--green); } .filecard .del { color: var(--red); }
  .filecard pre { margin: 0; padding: 10px 12px; border-top: 1px solid var(--border); overflow-x: auto; font-size: 12.5px; background: #0a0e14; }
  .dl-add { color: var(--green); } .dl-del { color: var(--red); } .dl-hunk { color: var(--accent); } .dl-ctx { color: var(--dim); }

  footer { position: relative; flex-shrink: 0; border-top: 1px solid var(--border); background: var(--panel); padding: 10px 14px; display: flex; gap: 10px; align-items: flex-end; }
  .ac { display: none; position: absolute; bottom: 56px; left: 14px; right: 120px; z-index: 20; background: var(--panel2);
    border: 1px solid var(--border); border-radius: 8px; overflow: hidden; max-height: 280px; overflow-y: auto; box-shadow: 0 -6px 24px #0008; }
  .ac.open { display: block; }
  .ac .ai { padding: 6px 12px; cursor: pointer; display: flex; gap: 10px; }
  .ac .ai.sel, .ac .ai:hover { background: var(--accent); color: var(--bg); }
  .ac .ai .an { font-family: "SF Mono", Consolas, monospace; font-weight: 600; min-width: 96px; }
  .ac .ai .ad { color: var(--dim); font-size: 12px; } .ac .ai.sel .ad, .ac .ai:hover .ad { color: var(--bg); }
  #input { flex: 1; resize: none; min-height: 22px; max-height: 160px; overflow-y: auto; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; font: inherit; }
  #input:focus { outline: none; border-color: var(--accent); }
  footer button { cursor: pointer; border: none; border-radius: 8px; padding: 9px 16px; font-weight: 600; }
  #send { background: var(--accent); color: var(--bg); }
  #stop { background: var(--red); color: var(--bg); display: none; }
  body.running #stop { display: inline-block; }
  .hint { color: var(--dim); font-size: 11px; }
</style>
</head>
<body>
<header>
  <span class="brand">grok-code</span>
  <select id="sessions" class="sel" title="Conversation threads"></select>
  <span class="toggle" id="newchat" title="New conversation">＋</span>
  <span class="meta" id="model" title="Click to switch model">connecting…</span>
  <span class="ws" id="ws" title="Click to change workspace"></span>
  <span class="spacer"></span>
  <span id="usage"></span>
  <select id="approval" class="sel" title="Approval mode"></select>
  <span class="toggle agents" id="t-agents" title="Multi-agent mode">⚡ multi-agent</span>
  <span class="toggle yes" id="t-yes" title="Always approve (destructive still blocked)">✓ auto-approve</span>
  <span class="toggle" id="debug" title="Open this thread's live debug state">🐞</span>
  <span class="toggle" id="cmds" title="Commands">☰</span>
  <div id="menu" class="menu"></div>
</header>
<main>
  <div id="chat"></div>
  <div id="side">
    <div id="plan-panel" class="panel" style="display:none">
      <h3>Plan <span id="plan-prog" class="prog"></span></h3>
      <div id="plan"></div>
    </div>
    <div class="panel">
      <h3>Agents</h3>
      <div id="agents"><div class="muted">No agent activity yet.</div></div>
    </div>
  </div>
</main>
<footer>
  <div id="ac" class="ac"></div>
  <textarea id="input" rows="1" placeholder="Message grok-code…  (Enter to send, Shift+Enter for newline. Type / for commands. You can also type while it works to interject.)"></textarea>
  <button id="send">Send</button>
  <button id="stop">⏹ Stop</button>
</footer>
<script>
const token = new URLSearchParams(location.search).get("t") || "";
let SESSION = "";
const sessParam = () => (SESSION ? "&session=" + encodeURIComponent(SESSION) : "");
const q = (p, b) => fetch(p + "?t=" + token + sessParam(), b && { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(b) });
const IMG_EXT = /\.(png|jpe?g|gif|webp|svg|bmp|ico|avif)$/i;
const fileUrl = (p) => "/api/file?t=" + token + sessParam() + "&path=" + encodeURIComponent(p);
const chat = document.getElementById("chat");
const agentsEl = document.getElementById("agents");
const planEl = document.getElementById("plan");
const planPanel = document.getElementById("plan-panel");
const planProg = document.getElementById("plan-prog");
const AGENTS = new Map();
const input = document.getElementById("input");
const elModel = document.getElementById("model");
const elWs = document.getElementById("ws");
const elApproval = document.getElementById("approval");
const elUsage = document.getElementById("usage");
const tAgents = document.getElementById("t-agents");
const tYes = document.getElementById("t-yes");
const elCmds = document.getElementById("cmds");
const elMenu = document.getElementById("menu");
const elAc = document.getElementById("ac");
const elSessions = document.getElementById("sessions");
const elNewChat = document.getElementById("newchat");
const elDebug = document.getElementById("debug");
let COMMANDS = [];
let CAN_CD = false;
let CAN_MODEL = false;

function atBottom() { return chat.scrollHeight - chat.scrollTop - chat.clientHeight < 80; }
function scroll() { chat.scrollTop = chat.scrollHeight; }

// Minimal, safe markdown: escape first, then a few inline/block patterns.
function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function md(s) {
  const parts = esc(s).split(/(```[\s\S]*?```)/g);
  return parts.map((p) => {
    if (p.startsWith("```")) return "<pre class=mono>" + p.replace(/^```[a-z]*\n?/i, "").replace(/```$/, "") + "</pre>";
    return p
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
      .replace(/^### (.+)$/gm, "<b>$1</b>")
      .replace(/^[-*] (.+)$/gm, "• $1")
      .replace(/\n/g, "<br>");
  }).join("");
}

function addMsg(role, text) {
  const stick = atBottom();
  const d = document.createElement("div");
  d.className = "msg " + role;
  d.innerHTML = role === "user" ? esc(text) : md(text);
  chat.appendChild(d);
  if (stick) scroll();
}

function colorDiff(body) {
  return esc(body).split("\n").map((l) => {
    if (l.startsWith("+") && !l.startsWith("+++")) return "<span class=dl-add>" + l + "</span>";
    if (l.startsWith("-") && !l.startsWith("---")) return "<span class=dl-del>" + l + "</span>";
    if (l.startsWith("@@")) return "<span class=dl-hunk>" + l + "</span>";
    return "<span class=dl-ctx>" + l + "</span>";
  }).join("\n");
}

// A collapsible file card. Lazily renders on first expand: an <img> for image
// files, the provided git diff for changed files, or the fetched file contents.
function expandableFile(headHtml, p, diffBody) {
  const card = document.createElement("div");
  card.className = "filecard";
  card.style.marginTop = "8px";
  const head = document.createElement("div");
  head.className = "fhead";
  head.innerHTML = headHtml;
  const body = document.createElement("div");
  body.style.display = "none";
  let loaded = false;
  head.onclick = async () => {
    const open = body.style.display === "none";
    body.style.display = open ? "block" : "none";
    head.querySelector(".caret").textContent = open ? "▼" : "▶";
    if (!open || loaded) return;
    loaded = true;
    if (IMG_EXT.test(p)) {
      const img = document.createElement("img");
      img.src = fileUrl(p);
      img.style.cssText = "max-width:100%;display:block;border-top:1px solid var(--border)";
      img.onerror = () => { body.innerHTML = "<pre class=mono>(image not available)</pre>"; };
      body.appendChild(img);
    } else {
      const pre = document.createElement("pre");
      pre.className = "mono";
      if (diffBody != null) {
        pre.innerHTML = colorDiff(diffBody);
      } else {
        pre.textContent = "loading…";
        try { pre.textContent = await (await fetch(fileUrl(p))).text(); } catch { pre.textContent = "(could not load)"; }
      }
      body.appendChild(pre);
    }
  };
  card.appendChild(head);
  card.appendChild(body);
  return card;
}

function addChanges(files) {
  const stick = atBottom();
  const wrap = document.createElement("div");
  wrap.className = "msg assistant";
  wrap.style.maxWidth = "92%";
  wrap.innerHTML = "<b>Changed " + files.length + " file(s)</b> <span class=hint>(click a file to expand)</span>";
  for (const f of files) {
    const head = "<span class=caret>▶</span><b class=mono>" + esc(f.status + " " + f.path) +
      "</b><span class=stat><span class=add>+" + f.additions + "</span>/<span class=del>-" + f.deletions + "</span></span>";
    wrap.appendChild(expandableFile(head, f.path, IMG_EXT.test(f.path) ? null : f.body));
  }
  chat.appendChild(wrap);
  if (stick) scroll();
}

// Files the agent read this task — accumulated into one collapsible card.
let viewedCard = null;
const viewedPaths = new Set();
function resetViewed() { viewedCard = null; viewedPaths.clear(); }
function addViewed(ev) {
  if (viewedPaths.has(ev.path)) return;
  viewedPaths.add(ev.path);
  if (!viewedCard) {
    const stick = atBottom();
    viewedCard = document.createElement("div");
    viewedCard.className = "msg assistant";
    viewedCard.style.maxWidth = "92%";
    viewedCard.innerHTML = "<b>👁 Viewed files</b> <span class=hint>(click a file to preview)</span>";
    chat.appendChild(viewedCard);
    if (stick) scroll();
  }
  viewedCard.appendChild(expandableFile("<span class=caret>▶</span><b class=mono>" + esc(ev.path) + "</b>", ev.path, null));
}

function addRequest(ev) {
  const stick = atBottom();
  const card = document.createElement("div");
  card.className = "card " + (ev.kind === "approval" ? "approval" : "ask");
  card.dataset.id = ev.id;
  if (ev.kind === "approval") {
    const p = ev.payload;
    card.innerHTML =
      "<div class=chead>⚠ Approval required</div><div class='cbody scroll'>" +
      "<div class=kv><b>Operation:</b> " + esc(p.operation || "") + "</div>" +
      "<div class=kv><b>Request:</b> <span class=mono>" + esc(p.command || "") + "</span></div>" +
      "<div class=kv><b>Reason:</b> " + esc(p.reason || "") + "</div>" +
      "<div class=kv><b>Risk:</b> " + esc(p.risk || "") + "</div></div><div class=cfoot></div>";
    const row = document.createElement("div"); row.className = "btnrow"; row.style.marginTop = "0";
    const mk = (label, cls, fn) => { const b = document.createElement("button"); b.className = "act-btn " + cls; b.textContent = label; b.onclick = fn; return b; };
    row.appendChild(mk("Allow once", "primary", () => respond(ev.id, { approved: true, rememberSimilar: false })));
    row.appendChild(mk("Allow & remember", "", () => respond(ev.id, { approved: true, rememberSimilar: true })));
    row.appendChild(mk("Deny", "danger", () => respond(ev.id, { approved: false })));
    card.querySelector(".cfoot").appendChild(row);
  } else {
    const qs = ev.payload.questions || [];
    // Questions scroll inside the card; the Submit button stays pinned in a footer
    // so it's always reachable no matter how many questions there are.
    let html = "<div class=chead>❓ A few questions</div><div class='cbody scroll'>";
    qs.forEach((q, i) => { html += "<div class=kv style='color:var(--text);margin-top:8px'>" + esc(q.question) + "</div><div class=btnrow data-qi=" + i + "></div><input type=text data-free=" + i + " placeholder='or type your own…'>"; });
    html += "</div><div class=cfoot></div>";
    card.innerHTML = html;
    qs.forEach((q, i) => {
      const row = card.querySelector("[data-qi='" + i + "']");
      (q.options || []).forEach((opt) => {
        const b = document.createElement("button"); b.className = "act-btn"; b.textContent = opt;
        b.onclick = () => { card.querySelector("[data-free='" + i + "']").value = opt; row.querySelectorAll("button").forEach((x) => x.classList.remove("primary")); b.classList.add("primary"); };
        row.appendChild(b);
      });
    });
    const submit = document.createElement("button"); submit.className = "act-btn primary"; submit.textContent = "Submit answers";
    submit.onclick = () => {
      const answers = qs.map((q, i) => ({ answer: card.querySelector("[data-free='" + i + "']").value }));
      respond(ev.id, { answers });
    };
    card.querySelector(".cfoot").appendChild(submit);
  }
  chat.appendChild(card);
  // Only auto-scroll to the card if the user was already at the bottom — otherwise
  // a stream of request cards yanks the view down and they can't scroll up to read.
  if (stick) requestAnimationFrame(() => card.scrollIntoView({ block: "nearest" }));
}

function respond(id, body) {
  q("/api/respond", { id, ...body });
  const card = chat.querySelector(".card[data-id='" + id + "']");
  if (card) { card.classList.add("resolved"); card.querySelectorAll("button,input").forEach((b) => (b.disabled = true)); }
}

function agentCard(name) {
  let a = AGENTS.get(name);
  if (a) return a;
  const placeholder = agentsEl.querySelector(".muted");
  if (placeholder) placeholder.remove();
  const el = document.createElement("div");
  el.className = "agent running";
  el.innerHTML = "<div class=ahead><span class=dot></span><span class=aname></span><span class=astep></span></div><div class=ausage></div><div class=alog></div>";
  el.querySelector(".aname").textContent = name;
  agentsEl.appendChild(el);
  a = { el, log: el.querySelector(".alog"), step: el.querySelector(".astep"), usage: el.querySelector(".ausage"), steps: 0 };
  AGENTS.set(name, a);
  return a;
}
function addUsage(ev) {
  const a = agentCard(ev.agent);
  a.el.classList.add("running");
  a.usage.textContent = "🪙 " + ev.line;
}
function addAct(ev) {
  const a = agentCard(ev.agent);
  a.el.classList.add("running");
  if (ev.kind === "tool_batch") { a.steps++; a.step.textContent = a.steps + (a.steps === 1 ? " step" : " steps"); }
  const line = document.createElement("div");
  line.className = "aline " + (ev.kind === "warn" ? "warn" : ev.kind === "verifier" ? "verifier" : ev.kind === "tool_batch" ? "cur" : "");
  line.textContent = ev.message;
  a.log.appendChild(line);
  while (a.log.children.length > 8) a.log.removeChild(a.log.firstChild);
  a.log.scrollTop = a.log.scrollHeight;
}
function addPlan(ev) {
  const steps = ev.steps || [];
  planPanel.style.display = "block";
  planProg.textContent = steps.filter((s) => s.status === "completed").length + "/" + steps.length;
  planEl.innerHTML = "";
  for (const s of steps) {
    const cls = s.status === "completed" ? "done" : s.status === "in_progress" ? "active" : "pending";
    const ico = s.status === "completed" ? "✓" : s.status === "in_progress" ? "▶" : "○";
    const d = document.createElement("div");
    d.className = "pstep " + cls;
    d.innerHTML = "<span class=ico>" + ico + "</span><span class=txt></span>";
    d.querySelector(".txt").textContent = s.step;
    planEl.appendChild(d);
  }
}
function resetAgents() {
  AGENTS.clear();
  agentsEl.innerHTML = "<div class=muted>Working…</div>";
}
function endAgents() {
  for (const a of AGENTS.values()) a.el.classList.remove("running");
}

function setMode(agents, yes) {
  tAgents.classList.toggle("on", agents);
  tYes.classList.toggle("on", yes);
}

function addOutput(title, text) {
  const stick = atBottom();
  const d = document.createElement("div");
  d.className = "out";
  const h = document.createElement("div"); h.className = "ohead"; h.textContent = title;
  const pre = document.createElement("pre"); pre.className = "mono"; pre.textContent = text;
  d.appendChild(h); d.appendChild(pre); chat.appendChild(d);
  if (stick) scroll();
}

function addTrust(ev) {
  const stick = atBottom();
  const card = document.createElement("div");
  card.className = "card ask";
  card.innerHTML = "<div class=chead>🔒 Workspace trust</div><div class=cbody>" +
    "<div class=kv><b>Directory:</b> <span class=mono>" + esc(ev.workspace) + "</span></div>" +
    "<div class=kv><b>Current:</b> " + esc(ev.current) + "</div></div>";
  const body = card.querySelector(".cbody");
  const row = document.createElement("div"); row.className = "btnrow";
  const mk = (label, cls, action) => {
    const b = document.createElement("button"); b.className = "act-btn " + cls; b.textContent = label;
    b.onclick = () => { q("/api/trust", { action }); card.classList.add("resolved"); card.querySelectorAll("button").forEach((x) => (x.disabled = true)); };
    return b;
  };
  row.appendChild(mk("Trust this directory only", "primary", "exact"));
  row.appendChild(mk("Trust directory + subdirectories", "", "descendants"));
  row.appendChild(mk("Clear trust", "danger", "clear"));
  body.appendChild(row);
  chat.appendChild(card);
  if (stick) scroll();
}

function renderSessions(list, activeId) {
  elSessions.innerHTML = "";
  for (const s of list) {
    const o = document.createElement("option");
    o.value = s.id;
    o.textContent = (s.running ? "● " : "") + (s.title || s.id);
    elSessions.appendChild(o);
  }
  elSessions.value = SESSION || activeId || (list[0] && list[0].id) || "";
}

function applyState(st) {
  if (st.sessionId) SESSION = st.sessionId;
  if (Array.isArray(st.sessions)) renderSessions(st.sessions, st.activeId);
  elModel.textContent = st.model;
  elWs.textContent = st.workspace;
  CAN_CD = !!st.canSwitchWorkspace;
  CAN_MODEL = !!st.canSwitchModel;
  if (Array.isArray(st.commands)) COMMANDS = st.commands;
  setMode(st.agents, st.yes);
  if (Array.isArray(st.approvalModes)) {
    elApproval.innerHTML = "";
    for (const m of st.approvalModes) {
      const o = document.createElement("option"); o.value = m; o.textContent = "approval: " + m; elApproval.appendChild(o);
    }
  }
  if (st.approval) elApproval.value = st.approval;
}

function handle(ev) {
  switch (ev.type) {
    case "chat": addMsg(ev.role, ev.text); break;
    case "activity": addAct(ev); break;
    case "request": addRequest(ev); break;
    case "request_resolved": { const c = chat.querySelector(".card[data-id='" + ev.id + "']"); if (c) { c.classList.add("resolved"); c.querySelectorAll("button,input").forEach((b) => (b.disabled = true)); } break; }
    case "task":
      document.body.classList.toggle("running", ev.status === "running");
      if (ev.status === "running") { resetAgents(); resetViewed(); }
      else endAgents();
      if (ev.status === "error") addMsg("error", "Error: " + (ev.message || "")); break;
    case "changes": addChanges(ev.files); break;
    case "usage": elUsage.textContent = ev.line; break;
    case "mode": setMode(ev.agents, ev.yes); break;
    case "output": addOutput(ev.title, ev.text); break;
    case "state": applyState(ev); break;
    case "trust": addTrust(ev); break;
    case "plan": addPlan(ev); break;
    case "viewed": addViewed(ev); break;
    case "agent_usage": addUsage(ev); break;
  }
}

// ---- GUI: commands menu, workspace switch, approval, slash autocomplete ----
function runCommand(name) {
  const needsArg = { "/cd": "New workspace path:", "/approval": "Mode (on-request/auto-local/auto-safe/auto-all/never):", "/drop": "Context item id:", "/bg-stop": "Background command id:" };
  let cmd = name;
  if (needsArg[name]) { const a = prompt(needsArg[name]); if (a === null) return; cmd = a.trim() ? name + " " + a.trim() : name; }
  q("/api/message", { text: cmd });
}
elCmds.onclick = (e) => {
  e.stopPropagation();
  if (elMenu.classList.contains("open")) { elMenu.classList.remove("open"); return; }
  elMenu.innerHTML = "";
  for (const c of COMMANDS) {
    if (c.name === "/exit") continue;
    const mi = document.createElement("div"); mi.className = "mi";
    mi.innerHTML = "<span class=mname>" + esc(c.usage) + "</span><span class=mdesc>" + esc(c.description) + "</span>";
    mi.onclick = () => { elMenu.classList.remove("open"); runCommand(c.name); };
    elMenu.appendChild(mi);
  }
  elMenu.classList.add("open");
};
document.addEventListener("click", () => elMenu.classList.remove("open"));
elWs.onclick = () => { if (!CAN_CD) { alert("Workspace switching is unavailable in this session."); return; } const p = prompt("New workspace path:", elWs.textContent); if (p && p.trim()) q("/api/message", { text: "/cd " + p.trim() }); };
elModel.onclick = () => { if (!CAN_MODEL) return; const m = prompt("Switch model to:", elModel.textContent); if (m && m.trim()) q("/api/message", { text: "/model " + m.trim() }); };
elModel.style.cursor = "pointer"; elModel.title = "Click to switch model";
elApproval.onchange = () => q("/api/message", { text: "/approval " + elApproval.value });

// Slash autocomplete in the input.
let acSel = 0;
function acItems() { const v = input.value; if (!v.startsWith("/") || v.includes(" ")) return []; const n = v.toLowerCase(); return COMMANDS.filter((c) => c.name.startsWith(n)); }
function renderAc() {
  const items = acItems();
  if (items.length === 0) { elAc.classList.remove("open"); return; }
  if (acSel >= items.length) acSel = 0;
  elAc.innerHTML = "";
  items.forEach((c, i) => {
    const ai = document.createElement("div"); ai.className = "ai" + (i === acSel ? " sel" : "");
    ai.innerHTML = "<span class=an>" + esc(c.name) + "</span><span class=ad>" + esc(c.description) + "</span>";
    ai.onclick = () => { input.value = c.name + " "; elAc.classList.remove("open"); input.focus(); };
    elAc.appendChild(ai);
  });
  elAc.classList.add("open");
}

let es = null;
function connect() {
  if (es) es.close();
  es = new EventSource("/api/events?t=" + token + sessParam());
  es.onmessage = (e) => { try { handle(JSON.parse(e.data)); } catch {} };
}
async function refreshState() {
  const st = await (await q("/api/state")).json();
  applyState(st);
  elUsage.textContent = st.usage || "";
}
async function switchTo(id) {
  if (!id || id === SESSION) return;
  SESSION = id;
  await q("/api/sessions/activate", { id });
  chat.innerHTML = "";
  AGENTS.clear();
  resetViewed();
  agentsEl.innerHTML = "<div class=muted>No agent activity yet.</div>";
  planPanel.style.display = "none";
  await refreshState();
  connect();
}
elSessions.onchange = () => switchTo(elSessions.value);
elSessions.onfocus = async () => {
  const r = await (await q("/api/sessions")).json();
  if (Array.isArray(r.sessions)) renderSessions(r.sessions, r.activeId);
};
elNewChat.onclick = async () => {
  const r = await (await q("/api/sessions", {})).json();
  if (r.id) await switchTo(r.id);
};
elDebug.onclick = () => window.open("/api/debug?t=" + token + sessParam(), "_blank");

async function init() {
  const st = await (await q("/api/state")).json();
  SESSION = st.sessionId || st.activeId || "";
  applyState(st);
  elUsage.textContent = st.usage || "";
  connect();
}

function send() {
  const text = input.value.trim();
  if (!text) return;
  q("/api/message", { text });
  input.value = ""; input.style.height = "auto";
}
input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = Math.min(160, input.scrollHeight) + "px"; acSel = 0; renderAc(); });
input.addEventListener("keydown", (e) => {
  const open = elAc.classList.contains("open");
  if (open) {
    const items = acItems();
    if (e.key === "ArrowDown") { e.preventDefault(); acSel = (acSel + 1) % items.length; renderAc(); return; }
    if (e.key === "ArrowUp") { e.preventDefault(); acSel = (acSel - 1 + items.length) % items.length; renderAc(); return; }
    if (e.key === "Escape") { elAc.classList.remove("open"); return; }
    if ((e.key === "Tab" || e.key === "Enter") && items[acSel]) { e.preventDefault(); input.value = items[acSel].name + " "; elAc.classList.remove("open"); return; }
  }
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); elAc.classList.remove("open"); send(); }
});
document.getElementById("send").onclick = send;
document.getElementById("stop").onclick = () => q("/api/interrupt", {});
tAgents.onclick = () => q("/api/toggle", { agents: !tAgents.classList.contains("on") });
tYes.onclick = () => q("/api/toggle", { yes: !tYes.classList.contains("on") });
init();
</script>
</body>
</html>
